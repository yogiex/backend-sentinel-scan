name: ci

on:
  push:
    branches: [main, master, develop, dev]
  pull_request:
    branches: [main, master, develop, dev]

permissions:
  contents: read

jobs:
  lint-sast:
    name: Lint & SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Single source of truth: the `go` directive in go.mod (1.25.10).
          go-version-file: go.mod
          cache: true

      - run: go mod download

      - name: golangci-lint (gosec + staticcheck + govet)
        uses: golangci/golangci-lint-action@v6
        with:
          # v1.64.x is the last v1 release built with Go 1.25 support.
          version: v1.64.8
          args: --timeout=8m

      - name: Secret scan — gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sca:
    name: Dependency CVE scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go mod download

      - name: OSV-Scanner — scan go.mod for CVEs
        uses: google/osv-scanner/actions/scanner@v1
        with:
          scan-args: |-
            -r
            --skip-git=true
            ./go.mod

  test:
    name: Build, vet & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go mod download

      - name: Build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        # The legacy e2e suite (test/e2e, build tag `e2e`) targets APIs that do
        # not exist yet and is excluded until it is rewritten.
        run: go test ./... -count=1
