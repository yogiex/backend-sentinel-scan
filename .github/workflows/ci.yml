name: ci

on:
  push:
    branches: [main, master, develop, dev]
  pull_request:
    branches: [main, master, develop, dev]

permissions:
  contents: read

jobs:
  lint-sast:
    name: Lint & SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Single source of truth: the `go` directive in go.mod (1.25.10).
          go-version-file: go.mod
          cache: true

      - run: go mod download

      - name: Install golangci-lint
        # Build from source with the module's own toolchain: the prebuilt
        # v1.64 binary is compiled with Go 1.24 and refuses a go1.25 module.
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: golangci-lint (gosec + staticcheck + govet)
        run: $(go env GOPATH)/bin/golangci-lint run --timeout=8m

      - name: Secret scan — gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sca:
    name: Dependency CVE scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go mod download

      - name: Install osv-scanner
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL -o "$HOME/.local/bin/osv-scanner" \
            https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          chmod +x "$HOME/.local/bin/osv-scanner"

      - name: OSV-Scanner — scan source tree for CVEs
        # Advisory for now: the pinned golang.org/x/{crypto,net,text} versions
        # have known module-level CVEs. The fixes require Go >= 1.26, which is
        # a separate module-wide migration (see docs/BACKEND-DEV.md).
        continue-on-error: true
        run: "$HOME/.local/bin/osv-scanner scan source -r ./"

  test:
    name: Build, vet & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go mod download

      - name: Build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        # The legacy e2e suite (test/e2e, build tag `e2e`) targets APIs that do
        # not exist yet and is excluded until it is rewritten.
        run: go test ./... -count=1
