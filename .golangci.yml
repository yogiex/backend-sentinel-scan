run:
  timeout: 5m
  issues-exit-code: 1
  tests: false

linters:
  enable:
    - gosec
    - staticcheck
    - govet
    - gosimple
    - unused
    - ineffassign
  disable:
    - typecheck
    # errcheck and revive are disabled until the pre-existing backlog
    # (~44 unchecked errors, ~320 missing doc comments) is paid down.
    # Re-enable them one at a time, then delete this note.
    - errcheck
    - revive

linters-settings:
  gosec:
    severity: medium
    confidence: low
    excludes:
      - G204  # Subprocess launched with variable — false positives in template loader
      - G304  # File path provided as tainted parameter — nuclei loader uses user input
  staticcheck:
    checks:
      - all
      - -SA1019

issues:
  exclude-dirs:
    - vendor
    - .gocache
    - .gomodcache
  max-issues-per-linter: 0
  max-same-issues: 0
