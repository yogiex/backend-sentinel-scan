metadata:
  id: "idor"
  name: "Insecure Direct Object Reference"
  description: "Detects IDOR by accessing another user's resource"
  severity: "high"
  tags: ["idor", "access-control", "authorization"]

engine: "http"
method: "GET"
path: "/api/users/FUZZ&id=FUZZ&userId=FUZZ"

payloads:
  - name: "adjacent-id"
    value: "1001"
  - name: "negative-id"
    value: "-1"
  - name: "zero-id"
    value: "0"
  - name: "string-id"
    value: "admin"

matchers:
  - type: "status"
    patterns:
      - "200"
    location: "status"
    condition: "or"

  - type: "keyword"
    patterns:
      - "\"email\":"
      - "\"role\":"
      - "\"is_admin\":"
      - "\"permissions\":"
    location: "body"
    condition: "or"
