metadata:
  id: "ssrf"
  name: "Server-Side Request Forgery"
  description: "Detects SSRF by injecting internal/external URLs"
  severity: "high"
  tags: ["ssrf", "server-side", "request-forgery"]

engine: "http"
method: "GET"
path: "/fetch?url=FUZZ&file=FUZZ&path=FUZZ&dest=FUZZ"

payloads:
  - name: "local-host"
    value: "http://127.0.0.1:80"
  - name: "local-ip"
    value: "http://10.0.0.1:80"
  - name: "metadata-aws"
    value: "http://169.254.169.254/latest/meta-data/"
  - name: "metadata-gcp"
    value: "http://metadata.google.internal/"
  - name: "internal-service"
    value: "http://localhost:8080/admin"

matchers:
  - type: "keyword"
    patterns:
      - "root:x:0:0"
      - "ami-id"
      - "instance-id"
      - "meta-data"
      - "computeMetadata"
      - "localhost"
    location: "body"
    condition: "or"

  - type: "status"
    patterns:
      - "200"
    location: "status"
    condition: "or"
